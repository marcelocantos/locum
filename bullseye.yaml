  T2.1:
    name: Interrupt taxonomy has a single writer and is consistent across its writers
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - a check that the README interrupt rows, manifesto table rows, and 🎯T1.7 kind list are the same ordered set of names (and that scored-challenge exits match 🎯T1.12).
    - 'ENT-001 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-001 (P2). Status: observed fact. the closed human surface is the product. Four texts define the enum and the copy. They already disagree on (1) whether hardware tap is a kind, (2) Touch ID vs vault/passkey UV vs vault unlock, (3) OTP wording, (4) whether “avoid the surface” is a scored-challenge exit. The next implementation agent will pick a file and ship that enum. Remediation: pick one enum owner (manifesto table, or 🎯T1.7 acceptance). Make README a pointer or a generated digest. Align 🎯T1’s “Touch ID” wording with 🎯T1.7. State whether “hardware tap” is the same atom as “push ack”. Blast: 🎯T1.7, 🎯T1.11 headed hop, 🎯T1.12, any interrupt UX, and every later IdP playbook. Drift is cheap today (markdown) and expensive once a broker exists. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-001
    - p2
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
  T2.2:
    name: Non-goal inventories share a single source of truth
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'same as ENT-001: one list, the other links or is generated.'
    - 'ENT-002 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-002 (P2). Status: observed fact. two “do not build this” lists. A later reader can satisfy one list and violate the other (e.g. a Chrome-only vault integration is a README-legal non-goal miss, a manifesto violation). Remediation: README non-goals become a one-line pointer, or a strict subset generated from the manifesto list. Add the two manifesto-only bullets to README only if they are public commitments. Blast: 🎯T1.4, 🎯T1.5, 🎯T1.6, 🎯T1.10, 🎯T1.12, and any “why not Chrome’s password manager” debate. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-002
    - p2
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
  T2.3:
    name: Load-bearing claims have acceptance prose and oracle seam
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 🎯T1.4 `checks` non-empty and executed on the shipped path; a planted secret in a tool log fails CI.
    - 'ENT-003 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-003 (P3). Status: observed fact (no checks); inference (this will matter at first implementation). bullseye can track intent, but nothing will fail if the first broker logs `op` output into a tool argument. The most important safety property is currently a sentence. Remediation: when the first broker/test harness lands, put a `checks` entry on 🎯T1.4 that greps transcripts/logs for vault material, and a fixture that tries to echo the last fill. Blast: 🎯T1.4, 🎯T1.5, 🎯T1.6, and any agent transcript. Not a current runtime failure: there is no broker. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-003
    - p3
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
  T2.4:
    name: Public default branch has protection or CI; agent/governance files are present
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - '`gh api` protection exists; a workflow file exists; `hygiene_check.py` exits 0 against a real `hygiene.yaml`.'
    - 'ENT-004 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-004 (P3). Status: observed fact. anyone with write access (or a compromised token) can push to `master` with no required check. For a five-file ledger the blast radius is documentation. It becomes a secret-leak path the day a vault integration is prototyped on `master`. Remediation: when implementation starts: `AGENTS.md` (ledger vs code, vault-secret rule, manifesto as position SoT), branch protection requiring CI, `hygiene.yaml` declaring the actual floor. Optionally disable the unused wiki. Blast: default branch, future `.env` / storage-state mistakes, agent-implemented first commit without repo-local rails. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-004
    - p3
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
  T2.5:
    name: Apache LICENSE appendix has a filled-in copyright line; the Work has NOTICE
    status: identified
    value: 0.0
    cost: 0.0
