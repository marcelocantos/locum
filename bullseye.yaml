# bullseye.yaml — convergence targets for this project.
#
# Targets are desired project states expressed as testable properties,
# with dependency tracking and frontier computation. This file is the
# source of truth: read and written by the bullseye MCP server.
#
# AGENT RULE: Do NOT edit this file directly unless the user explicitly
# instructs you to, or the file is unloadable and you are performing an
# emergency repair. Prefer Bullseye MCP/CLI mutation tools (open/query/
# commit). Direct edits are detected via content_hash below.
#
# What is bullseye / how do I install it?
#   https://github.com/marcelocantos/bullseye
#
# This banner is regenerated by bullseye on every write — edit targets
# only through tools, not these lines.
# content_hash: sha256:0937c776e9cfe697d65871ff9e8baccab451d21da029ea4044cd1d6e98bad0a7

schema_version: 5
targets:
  T1:
    name: Locum stands in for a human on the open web with a correct identity plane
    status: converging
    value: 13.0
    cost: 13.0
    acceptance:
    - A worker can complete an ordinary authenticated site visit without the human driving SAML, forms, or login chrome
    - The human is interrupted only for a possession atom (Touch ID, OTP digits, push ack) or a scored-challenge handoff/stop
    - Vault secrets never appear in model context or tool-call arguments
    - Concurrent workers do not contend for a single Chromium user-data-dir
    context: A locum tenens does the whole practice. The human is the principal and appears only to attest a factor a deputy cannot forge. Chrome, SAML, and "review the login page" are not load-bearing. Phishing review is an independent policy box. Scored challenges are refused, not half-solved.
    depends_on:
    - T1.1
    - T1.2
    - T1.3
    - T1.4
    - T1.5
    - T1.6
    - T1.7
    - T1.8
    - T1.9
    - T1.10
    - T1.11
    - T1.12
    - T1.13
    tags:
    - thesis
    - identity-plane
    origin: bullseye_init
    discovered: 2026-08-16
  T1.1:
    name: Concurrent workers do not share a Chromium user-data-dir lock
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - Two locum sessions can run headed or headless at once without a profile SingletonLock failure
    - No worker is configured to use another session's user-data-dir
    - Playwright MCP's ~/.config/playwright-mcp/profile is never opened by locum
    context: The exclusive-owner pain is Chromium locking one profile, not Playwright. Named sessions or distinct storage-state copies, never one shared user-data-dir.
    tags:
    - sessions
    - concurrency
    origin: subdivide(🎯T1)
    discovered: 2026-08-16
  T1.10:
    name: Sessions are per-service or per-task, not one shared identity
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - Two services can hold distinct storage-state files
    - A worker can start with a fresh session
    - Replaying one service's state does not leak another service's cookies
    context: The principal did not want one authenticated entity. Isolation multiplies logins; that is intended.
    tags:
    - sessions
    origin: subdivide(🎯T1)
    discovered: 2026-08-16
  T1.11:
    name: A headed hop shows only the relevant tab and hides when a session exists
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - A hop raises one tab, not a browser full of unrelated work
    - Agent input is disabled for the duration of the hop
    - On session cookie or WebAuthn completion the window hides and the worker resumes
    context: The hop exists because passkeys and some IdP scores need a real document. It is not the default UI.
    depends_on:
    - T1.3
    tags:
    - headed-hop
    origin: subdivide(🎯T1)
    discovered: 2026-08-16
  T1.12:
    name: Scored challenges are detected and refused
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - reCAPTCHA and sibling iframes/scripts are classified as scored gates
    - Locum does not move the pointer, click tiles, or call a solver
    - The only legal next steps are avoid the surface, hand a real window, or stop
    context: A 70% mouse-fuzzer is how you lose the account. Detection plus cowardice is the product.
    tags:
    - captcha
    origin: subdivide(🎯T1)
    discovered: 2026-08-16
  T1.13:
    name: Cooperating services prefer API, PAT, MCP OAuth, or device flow over a page
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - A service that offers a non-browser grant is not opened in a worker solely to log in
    - Page automation is the fallback when the service did not opt in
    context: MCP OAuth already works where the server implemented it. Locum should not pretend the open web is that.
    tags:
    - api-first
    origin: subdivide(🎯T1)
    discovered: 2026-08-16
  T1.2:
    name: Ordinary page interaction is headless and agent-driven
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - Navigate, click, fill, and snapshot work without a visible window unless an interrupt fires
    - A fixture site with no auth can be completed headless end to end
    context: Headless is the default. A window is a hop, not the product.
    tags:
    - browser
    origin: subdivide(🎯T1)
    discovered: 2026-08-16
  T1.3:
    name: Auth gates are detected without presenting the whole site to the human
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - Password fields, well-known IdP hosts, /oauth/authorize, SAML ACS URLs, and WebAuthn ceremonies are classified as gates
    - A missed gate leaves the worker paused, not looping on a login form
    - A false positive does not dump an unrelated page into a human interrupt
    context: Start with boring signals. Do not start with a vision model. Detection names the gate; it does not hand the site to the human.
    tags:
    - detector
    origin: subdivide(🎯T1)
    discovered: 2026-08-16
  T1.4:
    name: Vault secrets never appear in model context or tool-call arguments
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - Password, TOTP, and session-token values are injected inside the broker
    - Agent transcripts and tool logs contain no vault secret material
    - A test that asks the model to echo the last fill payload cannot recover a real secret
    context: If the agent types what op returned into a tool-call log, locum is a password leak.
    tags:
    - vault
    - safety
    origin: subdivide(🎯T1)
    discovered: 2026-08-16
  T1.5:
    name: Passwords and TOTP are filled from 1Password
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - A site whose item lives in 1Password can be filled without the human typing
    - TOTP is generated from the vault item, not from the human or the model
    - Unlock of 1Password, when required, is a biometric sheet, not a password prompt in chat
    context: Chrome's password manager is optional. 1Password is the vault. op for strings; the broker fills.
    depends_on:
    - T1.4
    tags:
    - vault
    - 1password
    origin: subdivide(🎯T1)
    discovered: 2026-08-16
  T1.6:
    name: Passkeys assert through a real authenticator on a real document
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - No virtual WebAuthn authenticator is used for a real account
    - Assertion happens on a headed document with 1Password or the platform authenticator
    - The human sees only the authenticator sheet, with the RP name from the authenticator
    context: op cannot assert a passkey. A Playwright virtual authenticator is a different key. The page is required; driving it is not.
    depends_on:
    - T1.4
    tags:
    - passkeys
    origin: subdivide(🎯T1)
    discovered: 2026-08-16
  T1.7:
    name: Human interrupts are possession atoms only
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - The interrupt kinds are vault/passkey UV, OTP digits, push ack, and scored-challenge handoff or stop
    - No interrupt presents Okta, a SAML form, or a full login page as the thing to operate
    - OTP interrupt copy names the site and asks only for the code
    context: The industry used "sometimes a human factor exists" as a license to dump the whole site on the user. Locum does not.
    depends_on:
    - T1.3
    tags:
    - interrupts
    origin: subdivide(🎯T1)
    discovered: 2026-08-16
  T1.8:
    name: Origin and RP-ID policy is independent of the navigating agent
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - A lookalike host is refused before vault fill or WebAuthn
    - The checker is not the same process that chose the URL
    - Known IdP hosts and exact RP IDs are data, not a prompt
    context: Navigator-reviews-own-destination is author-reviews-own-PR. The human is a worse phishing reviewer than a jaundiced allowlist.
    tags:
    - policy
    - phishing
    origin: subdivide(🎯T1)
    discovered: 2026-08-16
  T1.9:
    name: SAML and OAuth redirect chains complete without a human driver
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - A fixture SAML or OAuth hop is followed until the original origin has a session cookie
    - The human is not shown intermediate IdP chrome unless a possession atom or scored challenge fires
    - The window, if raised, stays up for the whole chain and hides only after return to the original origin
    context: SAML is HTML and redirects. The protocol is not special. Hostile IdP scoring is a different target.
    depends_on:
    - T1.2
    - T1.3
    tags:
    - saml
    - oauth
    origin: subdivide(🎯T1)
    discovered: 2026-08-16
